[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.1",
    "bm25s[full]",
    "pystemmer>=2.1.1",
    "torch>=2.7.1",
    "transformers>=4.34.0",
    "sentence-transformers>=2.3.2",
    "faiss-cpu>=1.7.4",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
ignore_missing_imports = true
